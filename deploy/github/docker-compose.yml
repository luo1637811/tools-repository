# 用法（在仓库根目录执行）：
#   mkdir -p data
#   docker compose -f deploy/github/docker-compose.yml up -d --build
#   docker compose -f deploy/github/docker-compose.yml logs -f --tail=50
#
# 说明：build 的 context 是仓库根目录（Dockerfile 在根目录）
services:
  fleet:
    build:
      context: ../../
      dockerfile: Dockerfile
    image: fleet-tool:1.4.0
    container_name: fleet-tool
    restart: unless-stopped
    environment:
      FT_HOST: 0.0.0.0
      FT_PORT: "8787"
      FT_IDLE_EXIT: "0"
      FT_DATA: /data
      TZ: Asia/Shanghai
    volumes:
      - ../../data:/data
    ports:
      # 只绑本机，外网统一走 Caddy / Nginx 反代
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/api/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 有域名时启用；没有域名就注释掉这一段，用 IP:8787 临时访问
  caddy:
    image: caddy:2-alpine
    container_name: fleet-caddy
    restart: unless-stopped
    depends_on:
      - fleet
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
